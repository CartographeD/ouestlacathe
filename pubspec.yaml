name: ou_est_la_cathe
description: "Une boussole pour retrouver la Cathédrale Notre-Dame de Strasbourg."

publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  geolocator: ^14.0.3
  permission_handler: ^13.0.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Configuration de l'icône de l'application
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo_app.png"
  adaptive_icon_background: "#FAF8F3"
  adaptive_icon_foreground: "assets/logo_app.png"

flutter:

  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600